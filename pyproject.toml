# Tool configuration for the telegramlm project.
# Dependencies are managed through requirements.txt / requirements-dev.txt
# and installed into a uv-managed virtual environment (see AGENTS.md).

[tool.ruff]
line-length = 100
exclude = [
    ".venv",
    ".specify",
    "specs",
]

[tool.ruff.lint]
# The project gate is `ruff check --select I .` (import sorting); keep the
# same selection here so a bare `ruff check .` behaves identically.
select = ["I"]

[tool.mypy]
python_version = "3.14"
strict = true
# hydrogram's update-handler decorators (@bot.on_message) carry no annotations
# at the library boundary; allow decorating with them while keeping every other
# strict check enabled.
disallow_untyped_decorators = false
exclude = [
    '(^|/)\.venv/',
    '(^|/)\.specify/',
    '(^|/)specs/',
]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# hydrogram ships inline annotations that are only partially precise and very
# slow to crawl on this filesystem; skip its internals and relax the strictest
# call checks at that boundary instead of wrapping every library call.
module = "hydrogram.*"
follow_imports = "skip"
disallow_untyped_calls = false
disallow_subclassing_any = false
